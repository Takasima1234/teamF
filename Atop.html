<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理画面</title>
    <link rel="stylesheet" href="Atop.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="img/logo.png" alt="DeckLab Logo" class="logo-image-actual">
            </div>
            <button class="new-registration-btn">新規登録</button>
        </header>

        <div class="search-area">
            <input type="text" placeholder="" class="search-input">
            <button class="search-btn">🔍</button>
        </div>

        <nav class="nav-buttons">
            <button class="nav-btn sales-btn">日別売上</button>
            <button class="nav-btn history-btn">販売履歴</button>
        </nav>

        <div class="item-list">
            <div class="item-card">
                <img src="img/zekrom_ex.jpg" alt="159/BW-P ゼクロムEXのカード画像" class="item-image-actual"> <div class="item-details">
                    <div class="price-info">
                        <label>変更前:</label>
                        <input type="text" value="12,000円" readonly class="old-price">
                    </div>
                    <div class="price-info">
                        <label>変更後:</label>
                        <input type="text" class="new-price">
                    </div>
                    <div class="quantity-input">
                        <input type="text" value="○○○○" class="quantity">
                    </div>
                </div>
                <div class="item-actions">
                    <button class="action-btn delete-btn">削除</button>
                    <button class="action-btn update-btn">更新</button>
                </div>
            </div>

            <div class="item-card">
                <img src="img/zekrom_ex.jpg" alt="159/BW-P ゼクロムEXのカード画像" class="item-image-actual"> <div class="item-details">
                    <div class="price-info">
                        <label>変更前:</label>
                        <input type="text" value="12,000円" readonly class="old-price">
                    </div>
                    <div class="price-info">
                        <label>変更後:</label>
                        <input type="text" class="new-price">
                    </div>
                    <div class="quantity-input">
                        <input type="text" value="○○○○" class="quantity">
                    </div>
                </div>
                <div class="item-actions">
                    <button class="action-btn delete-btn">削除</button>
                    <button class="action-btn update-btn">更新</button>
                </div>
            </div>
            
            <div class="item-card">
                <img src="img/zekrom_ex.jpg" alt="159/BW-P ゼクロムEXのカード画像" class="item-image-actual"> <div class="item-details">
                    <div class="price-info">
                        <label>変更前:</label>
                        <input type="text" value="12,000円" readonly class="old-price">
                    </div>
                    <div class="price-info">
                        <label>変更後:</label>
                        <input type="text" class="new-price">
                    </div>
                    <div class="quantity-input">
                        <input type="text" value="○○○○" class="quantity">
                    </div>
                </div>
                <div class="item-actions">
                    <button class="action-btn delete-btn">削除</button>
                    <button class="action-btn update-btn">更新</button>
                </div>
            </div>
            </div>
    </div>
</body>
</html>
